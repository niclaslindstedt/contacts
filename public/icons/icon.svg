<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a solid, stylized person silhouette — a head disc over a
       shoulders dome — filled with a green gradient on the app's dark surface,
       matching the bold single-glyph style of the sibling notes and checklist
       apps. The dome is a circle centred at (50, 87) r=35, cut flat at y=84
       with the two bottom corners filleted at r=4. The PNG install icons are
       generated from the same geometry by scripts/generate-icons.mjs
       (`npm run icons`). -->
  <defs>
    <linearGradient id="mark" x1="0" y1="15" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0b0d10"/>
  <circle cx="50" cy="31" r="16" fill="url(#mark)"/>
  <path d="M15.9 79.1 A35 35 0 0 1 84.1 79.1 A4 4 0 0 1 80.2 84 L19.8 84 A4 4 0 0 1 15.9 79.1 Z" fill="url(#mark)"/>
</svg>
