<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The app mark: a stylized person drawn as an outline — a head ring over
       rounded shoulders — stroked in the family's green gradient on the app's
       dark surface. The 64-unit viewBox, the 6-unit stroke with round caps and
       joins, and the #6ee7b7 → #34d399 ink are the same single-glyph language
       the sibling notes and checklist apps wear; only the plate colour differs,
       because each app's plate tracks its own theme_color (ours is #0b0d10, see
       src/app/look.ts and pwa-plugin.ts).

       The geometry is centred in the box on both axes: the mark's outer bounds
       run x 13→51 and y 10→54, so it fills 69% of the plate's height — big
       enough not to read as a stamp, and small enough that the maskable icon's
       further 10% inset keeps every corner inside the W3C 80%-diameter safe
       circle (they land at 91% of its radius). Redo that sum before growing it.

       The PNG install icons, the favicon.ico, and the Open Graph card are
       generated from this same geometry by scripts/generate-icons.mjs — edit
       both together and rerun `make icons`. -->
  <defs>
    <!-- userSpaceOnUse over the mark's exact vertical extent, so the head ring
         and the shoulders share one continuous gradient instead of each shape
         restarting it. Kept in lockstep with GRAD_Y0 / GRAD_Y1 in the generator. -->
    <linearGradient id="mark" x1="0" y1="10" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- rx is 20% of the side, matching the generator's default `radius: 0.2`. -->
  <rect width="64" height="64" rx="12.8" fill="#0b0d10" />
  <circle cx="32" cy="21.5" r="8.5" fill="none" stroke="url(#mark)" stroke-width="6" />
  <path
    d="M16 51 V48 a8 8 0 0 1 8 -8 H40 a8 8 0 0 1 8 8 V51"
    fill="none"
    stroke="url(#mark)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
