<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The default preset's page background. `useThemeColorMeta` only
         rewrites a tag that exists, so this seed is what lets it follow the
         active theme (Android's toolbar and task switcher read it). -->
    <meta name="theme-color" content="#010409" />
    <title>Contacts — a local-first address book</title>
    <meta
      name="description"
      content="Contacts is a local-first address book PWA. Your contacts live on your device, sync to Dropbox if you want, can be encrypted at rest, and export as vCard or CSV for Outlook, iOS, and Android."
    />
    <!-- The website is not meant to be found — people should reach the App
         Store page and apps.agilator.se — so every page and every deploy
         slot asks search engines not to index it (owner decision: no SEO).
         The home/ and privacy/ aliases are copies of this shell, so they
         carry it too. -->
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contacts — a local-first address book" />
    <meta
      property="og:description"
      content="A privacy-first contacts PWA: local-only or cloud-synced (Dropbox), optional encryption at rest, themes, achievements, and vCard/CSV export."
    />
    <meta property="og:url" content="https://contacts.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://contacts.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Contacts — a local-first address book"
    />
    <meta
      name="twitter:description"
      content="A privacy-first contacts PWA: local-only or cloud-synced, optional encryption at rest, and vCard/CSV export for Outlook, iOS, and Android."
    />
    <meta
      name="twitter:image"
      content="https://contacts.niclaslindstedt.se/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
